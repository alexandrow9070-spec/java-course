plugins {
    id 'java'
    id 'application'
}

group = 'ru.hofftech.omni'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(18)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'ch.qos.logback:logback-classic:1.2.12'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    //options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

application {
    // Главный класс приложения
    mainClass = 'ru.hofftech.omni.shipping.Shipping'
}

run {
    args 'test-input.txt', 6, 6, 'optimized', 10
}

tasks.register('Shipping', JavaExec) {
    group = 'application'
    description = 'Таска для работы с посылками/погрузками/разгрузками'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ru.hofftech.omni.shipping.ShippingApp'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'ru.hofftech.omni.shipping.ShippingApp'
        )
    }
}

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Собирает исполняемый jar со всеми зависимостями'
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                'Main-Class': 'ru.hofftech.omni.shipping.ShippingApp'
        )
    }

    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath
                .findAll { it.name.endsWith('jar') }
                .collect { zipTree(it) }
    }
}